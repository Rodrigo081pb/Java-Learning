# ========================================
# Configuracoes da Aplicacao
# ========================================
spring.application.name=myApi

# ========================================
# Configuracoes do Servidor
# ========================================
server.port=8080

# ========================================
# Configuracoes do SpringDoc OpenAPI (Swagger)
# ========================================
# Habilita a documentacao OpenAPI
springdoc.api-docs.enabled=true

# Caminho personalizado para o JSON do OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Habilita a interface do Swagger UI
springdoc.swagger-ui.enabled=true

# Caminho personalizado para o Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Ordena os endpoints por metodo HTTP
springdoc.swagger-ui.operations-sorter=method

# Ordena as tags alfabeticamente
springdoc.swagger-ui.tags-sorter=alpha

# Exibe a duracao das requisicoes
springdoc.swagger-ui.display-request-duration=true

# Tenta requisitar a API atraves do Swagger UI
springdoc.swagger-ui.try-it-out-enabled=true

# ========================================
# Configuracoes de Logging
# ========================================
logging.level.dio.myApi=INFO
logging.level.org.springframework.web=INFO

# ========================================
# Configuracoes de Charset e Encoding
# ========================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

